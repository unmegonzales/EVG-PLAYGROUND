<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <title>UNM Menu Layout Shell — 96×36 — Canva-friendly</title>
  <desc>Empty structural template for Canva / Adobe Illustrator. No prices. Photo slots labeled.</desc>
  <defs>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #4A4F55; font-size: 10.1px; font-weight: 700; }
      .label-sm { font-family: Arial, Helvetica, sans-serif; fill: #6b7280; font-size: 8.0px; font-weight: 600; }
      .label-inv { font-family: Arial, Helvetica, sans-serif; fill: #ffffff; font-size: 10.0px; font-weight: 700; }
      .title { font-family: Arial, Helvetica, sans-serif; fill: #171a1f; font-size: 25.2px; font-weight: 800; font-style: italic; }
    </style>
  </defs>

  <!-- Field -->
  <rect width="960" height="360" fill="#F6F6F8"/>

  <!-- HERO -->
  <rect x="0" y="0" width="960" height="79" fill="#ECEEF1"/>
  <line x1="0" y1="79" x2="960" y2="79" stroke="#BA0C2F" stroke-width="3.6"/>

  <!-- Brand block -->
  <rect x="19.2" y="14.2" width="43.5" height="43.5" rx="21.3" fill="#4A4F55" stroke="#A7A8AA" stroke-width="2"/>
  <text class="label-inv" x="40.9" y="41.1" text-anchor="middle">LOGO</text>
  <text class="label" x="74.5" y="30.0">LOBOS ATHLETICS</text>
  <text class="label-sm" x="74.5" y="43.5">University of New Mexico</text>
  <text class="label-sm" x="74.5" y="56.9">Location / Stand name</text>

  <!-- Fan Favorites center -->
  <rect x="364.8" y="9.5" width="153.6" height="17.4" fill="#00A8B5"/>
  <text class="label-inv" x="441.6" y="22.1" text-anchor="middle">VALUE MENU</text>
  <text class="title" x="441.6" y="49.0" text-anchor="middle">FAN FAVORITES</text>
  <text class="label-sm" x="441.6" y="64.8" text-anchor="middle" fill="#BA0C2F">Tagline</text>

  <!-- 4 for $4 badge -->
  <path d="M652.8,9.5 H748.8 V61.6 L729.6,71.1 H633.6 V19.0 Z" fill="#BA0C2F"/>
  <text class="label-inv" x="691.2" y="43.5" text-anchor="middle" font-size="18.0">4 FOR $4</text>

  <!-- PHOTO SLOTS (the "random boxes") -->
  <g id="four-for-four-photo-slots">
    <title>Replace these four boxes with product photos: Pepsi, Lobo Dog, Popcorn, Water</title>
    <rect x="768.0" y="14.2" width="38.4" height="35.6" rx="4" fill="#A7A8AA" stroke="#4A4F55" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="label-sm" x="787.2" y="33.2" text-anchor="middle" fill="#fff">PHOTO</text>
    <text class="label-sm" x="787.2" y="61.6" text-anchor="middle">Pepsi</text>
    <rect x="811.2" y="14.2" width="38.4" height="35.6" rx="4" fill="#A7A8AA" stroke="#4A4F55" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="label-sm" x="830.4" y="33.2" text-anchor="middle" fill="#fff">PHOTO</text>
    <text class="label-sm" x="830.4" y="61.6" text-anchor="middle">Dog</text>
    <rect x="854.4" y="14.2" width="38.4" height="35.6" rx="4" fill="#A7A8AA" stroke="#4A4F55" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="label-sm" x="873.6" y="33.2" text-anchor="middle" fill="#fff">PHOTO</text>
    <text class="label-sm" x="873.6" y="61.6" text-anchor="middle">Popcorn</text>
    <rect x="897.6" y="14.2" width="38.4" height="35.6" rx="4" fill="#A7A8AA" stroke="#4A4F55" stroke-width="1" stroke-dasharray="4 3"/>
    <text class="label-sm" x="916.8" y="33.2" text-anchor="middle" fill="#fff">PHOTO</text>
    <text class="label-sm" x="916.8" y="61.6" text-anchor="middle">Water</text>
  </g>

  <!-- 5 COLUMNS -->
  <rect x="0" y="79" width="960" height="224" fill="#ffffff" fill-opacity="0.85"/>
  <g id="col-1">
    <line x1="192.0" y1="87" x2="192.0" y2="295" stroke="#BA0C2F" stroke-opacity="0.35"/>
    <circle cx="24.0" cy="107.0" r="12" fill="#BA0C2F"/>
    <text class="label" x="44.0" y="113.0">FOOD</text>
    <text class="label-sm" x="16.0" y="149.0">Item ........ price</text>
    <text class="label-sm" x="16.0" y="174.0">Item ........ price</text>
    <text class="label-sm" x="16.0" y="199.0">Item ........ price</text>
  </g>
  <g id="col-2">
    <line x1="384.0" y1="87" x2="384.0" y2="295" stroke="#BA0C2F" stroke-opacity="0.35"/>
    <circle cx="216.0" cy="107.0" r="12" fill="#BA0C2F"/>
    <text class="label" x="236.0" y="113.0">SNACKS</text>
    <text class="label-sm" x="208.0" y="149.0">Item ........ price</text>
    <text class="label-sm" x="208.0" y="174.0">Item ........ price</text>
    <text class="label-sm" x="208.0" y="199.0">Item ........ price</text>
  </g>
  <g id="col-3">
    <line x1="576.0" y1="87" x2="576.0" y2="295" stroke="#BA0C2F" stroke-opacity="0.35"/>
    <circle cx="408.0" cy="107.0" r="12" fill="#BA0C2F"/>
    <text class="label" x="428.0" y="113.0">COLD DRINKS</text>
    <text class="label-sm" x="400.0" y="149.0">Item ........ price</text>
    <text class="label-sm" x="400.0" y="174.0">Item ........ price</text>
    <text class="label-sm" x="400.0" y="199.0">Item ........ price</text>
  </g>
  <g id="col-4">
    <line x1="768.0" y1="87" x2="768.0" y2="295" stroke="#BA0C2F" stroke-opacity="0.35"/>
    <circle cx="600.0" cy="107.0" r="12" fill="#BA0C2F"/>
    <text class="label" x="620.0" y="113.0">BEER + BOOZE</text>
    <text class="label-sm" x="592.0" y="149.0">Item ........ price</text>
    <text class="label-sm" x="592.0" y="174.0">Item ........ price</text>
    <text class="label-sm" x="592.0" y="199.0">Item ........ price</text>
  </g>
  <g id="col-5">
    <line x1="960.0" y1="87" x2="960.0" y2="295" stroke="#BA0C2F" stroke-opacity="0.35"/>
    <circle cx="792.0" cy="107.0" r="12" fill="#BA0C2F"/>
    <text class="label" x="812.0" y="113.0">COLUMN 5</text>
    <text class="label-sm" x="784.0" y="149.0">Item ........ price</text>
    <text class="label-sm" x="784.0" y="174.0">Item ........ price</text>
    <text class="label-sm" x="784.0" y="199.0">Item ........ price</text>
  </g>

  <!-- FOOTER -->
  <rect x="0" y="303" width="240.0" height="43" fill="#BA0C2F"/>
  <text class="label-inv" x="120.0" y="326.6" text-anchor="middle">CASHLESS</text>
  <rect x="240.0" y="303" width="192.0" height="43" fill="#12151A"/>
  <text class="label-inv" x="336.0" y="326.6" text-anchor="middle">WE FUEL CHAMPIONS</text>
  <rect x="432.0" y="303" width="268.8" height="43" fill="#4A4F55"/>
  <text class="label-inv" x="566.4" y="326.6" text-anchor="middle">PAY YOUR WAY</text>
  <rect x="700.8" y="303" width="259.2" height="43" fill="#00A8B5"/>
  <text class="label-inv" x="830.4" y="326.6" text-anchor="middle">THANK YOU</text>

  <rect x="0" y="346" width="960" height="14" fill="#ECEEF1"/>
  <text class="label-sm" x="12" y="355.1">Tax note · Print: 96 in × 36 in Landscape · Empty shell for Canva / Illustrator</text>
</svg>
