<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UNM Lobos · 25/26 Football Concessions Menus</title>
    <!-- Non-blocking fonts (page should render even if Google Fonts is slow/blocked) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700;800&family=Teko:wght@500;600;700&family=Great+Vibes&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700;800&family=Teko:wght@500;600;700&family=Great+Vibes&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-bar">
        <div class="app-bar__brand">
          <span class="app-bar__script">Lobos</span>
          <div>
            <strong>25/26 Football Concessions</strong>
            <p>Fireup print sizes · change-sheet pricing · Canva/print ready</p>
          </div>
        </div>
        <nav class="app-bar__nav" aria-label="Views">
          <button type="button" class="tab" data-view="deck">Full Deck</button>
          <button type="button" class="tab is-active" data-view="board">Single Board</button>
          <button type="button" class="tab" data-view="promo">4 for $4 Promo</button>
        </nav>
      </header>

      <section class="toolbar" id="boardToolbar">
        <label>
          Location / Print Size
          <select id="locationSelect"></select>
        </label>
        <button type="button" class="btn" id="printBtn">Print / PDF</button>
      </section>

      <!-- Deck: all location boards -->
      <main id="view-deck" class="view view--deck" hidden aria-label="Full menu deck"></main>

      <!-- Single board focus -->
      <main id="view-board" class="view view--board" aria-label="Single menu board"></main>

      <!-- Promo board -->
      <main id="view-promo" class="view view--promo" hidden aria-label="Four for four promo"></main>
    </div>

    <script src="menu-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
