<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="1200" viewBox="0 0 3600 1200" fill="none">
  <title>UNM Lobos F&amp;B Menu Background — Quiet Core</title>
  <desc>Calm Canva-ready board plate. Light field, thin brand accents, open columns for overlay text.</desc>

  <!-- Field (flat — no pattern wash for print clarity) -->
  <rect width="3600" height="1200" fill="#F6F6F8"/>

  <!-- Top brand frame -->
  <rect x="0" y="0" width="3600" height="25" fill="#BA0C2F"/>
  <rect x="0" y="25" width="3600" height="5" fill="#00A8B5"/>

  <!-- Soft header reserve -->
  <defs>
    <linearGradient id="headerFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F6F8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="30" width="3600" height="234" fill="url(#headerFade)"/>

  <!-- Side rails -->
  <rect x="0" y="30" width="12" height="1170" fill="#D6D7D9"/>
  <rect x="3588" y="30" width="12" height="1170" fill="#D6D7D9"/>

  <!-- Corner ticks (alignment aids) -->
  <rect x="144" y="312" width="40" height="6" fill="#D98898"/>
  <rect x="3416" y="312" width="40" height="6" fill="#D98898"/>
  <rect x="144" y="1080" width="40" height="6" fill="#D98898"/>
  <rect x="3416" y="1080" width="40" height="6" fill="#D98898"/>

  <!-- Faint 3-column guides -->
  <line x1="1242" y1="360" x2="1242" y2="1032" stroke="#A7A8AA" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="2358" y1="360" x2="2358" y2="1032" stroke="#A7A8AA" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Bottom edge -->
  <rect x="0" y="1183" width="3600" height="17" fill="#A7A8AA"/>
  <rect x="0" y="1183" width="200" height="17" fill="#BA0C2F"/>
  <rect x="3400" y="1183" width="200" height="17" fill="#BA0C2F"/>
  <rect x="200" y="1183" width="18" height="17" fill="#00A8B5"/>
  <rect x="3382" y="1183" width="18" height="17" fill="#00A8B5"/>
</svg>
