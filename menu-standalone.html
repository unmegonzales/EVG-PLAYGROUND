<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UNM Lobos · 25/26 Football Concessions Menus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700;800&family=Teko:wght@500;600;700&family=Great+Vibes&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
:root {
  --cherry: #ba0c2f;
  --cherry-deep: #8e0a24;
  --silver: #a7a8aa;
  --metal: #4a4f55;
  --turquoise: #00a8b5;
  --white: #ffffff;
  --light: #f4f4f6;
  --field: #f7f7f9;
  --ink: #171a1f;
  --muted: #5c6168;
  --board-shadow: 0 20px 55px rgba(23, 26, 31, 0.2);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #dde0e5;
  color: var(--ink);
  font-family: "Barlow", system-ui, sans-serif;
}

button,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

/* —— App chrome —— */
.app-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 22px;
  background: linear-gradient(180deg, #1a1d21 0%, #2a2e33 100%);
  color: var(--white);
  border-bottom: 3px solid var(--cherry);
}

.app-bar__brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.app-bar__script {
  font-family: "Great Vibes", cursive;
  font-size: 2rem;
  line-height: 1;
}

.app-bar__brand strong {
  display: block;
  font-family: "Teko", sans-serif;
  font-size: 1.45rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.app-bar__brand p {
  margin: 0;
  color: var(--silver);
  font-size: 0.78rem;
}

.app-bar__nav {
  display: flex;
  gap: 8px;
}

.tab {
  border: 1px solid rgba(167, 168, 170, 0.45);
  background: transparent;
  color: var(--white);
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.tab.is-active {
  background: var(--cherry);
  border-color: var(--cherry);
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 16px;
  padding: 14px 22px 0;
}

.toolbar label {
  display: grid;
  gap: 6px;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

.toolbar select {
  min-width: 260px;
  padding: 10px 12px;
  border: 1px solid #c9ccd1;
  border-radius: 8px;
  background: var(--white);
}

.btn {
  border: 0;
  background: var(--cherry);
  color: var(--white);
  padding: 11px 18px;
  border-radius: 8px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}

.btn--ghost {
  background: transparent;
  color: var(--cherry);
  border: 2px solid var(--cherry);
}

.view {
  padding: 22px;
}

.view--deck {
  display: grid;
  grid-template-columns: 1fr;
  gap: 28px;
  max-width: 1480px;
  margin: 0 auto;
}

.deck-card .stadium-board.is-landscape {
  min-height: 420px;
}

.deck-card .stadium-board.is-portrait {
  width: min(100%, 360px);
}

.deck-card {
  display: grid;
  gap: 10px;
}

.deck-card__label {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--metal);
}

/* =========================================================
   STADIUM BOARD — matches sample: hero / 5-col / footer
   ========================================================= */
.stadium-board {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  background:
    radial-gradient(ellipse at 8% 0%, rgba(255, 255, 255, 0.55), transparent 42%),
    radial-gradient(ellipse at 92% 8%, rgba(186, 12, 47, 0.12), transparent 40%),
    linear-gradient(180deg, #eceef1 0%, var(--field) 28%, #fbfbfc 100%);
  color: var(--ink);
  border: 1px solid #cfd2d7;
  box-shadow: var(--board-shadow);
  overflow: hidden;
  min-height: 360px;
}

.stadium-board--solo {
  max-width: 1480px;
  margin: 0 auto;
  width: 100%;
  min-height: 640px;
}

/* Fireup print aspect ratios (preview scale) */
.stadium-board.size-96x36 {
  aspect-ratio: 8 / 3;
  min-height: 0;
}

.stadium-board.size-192x48 {
  aspect-ratio: 4 / 1;
  min-height: 0;
  max-width: none;
}

.stadium-board.size-192x48.stadium-board--solo {
  max-width: 1600px;
}

.stadium-board.size-24x36,
.stadium-board.size-12x18 {
  aspect-ratio: 2 / 3;
  max-width: 520px;
  min-height: 0;
  margin-inline: auto;
}

.stadium-board.is-portrait .board-hero {
  grid-template-columns: 1fr;
  text-align: center;
  gap: 10px;
}

.stadium-board.is-portrait .board-hero__brand,
.stadium-board.is-portrait .board-hero__offer {
  justify-content: center;
}

.stadium-board.is-portrait .board-hero__offer {
  flex-direction: column;
}

.stadium-board.is-portrait .offer-products {
  grid-template-columns: repeat(4, minmax(44px, 1fr));
}

.stadium-board.is-portrait .board-cols {
  grid-template-columns: 1fr;
}

.stadium-board.is-portrait .menu-col {
  border-right: 0;
  border-bottom: 1px solid rgba(186, 12, 47, 0.25);
}

.stadium-board.is-portrait .menu-col:last-child {
  border-bottom: 0;
}

.stadium-board.is-portrait .board-footer {
  grid-template-columns: 1fr 1fr;
}

.stadium-board.is-compact .board-hero__favorites .favorites-title {
  font-size: clamp(1.4rem, 6vw, 2.2rem);
}

.stadium-board.is-compact .offer-badge {
  min-width: 96px;
}

.print-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  margin: 0 0 10px;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--metal);
}

.print-meta span {
  background: #fff;
  border: 1px solid #d0d3d8;
  border-radius: 999px;
  padding: 4px 10px;
}

/* —— Top hero tier —— */
.board-hero {
  display: grid;
  grid-template-columns: 1.05fr 1.35fr 1.35fr;
  gap: 14px;
  align-items: center;
  padding: 16px 18px 12px;
  border-bottom: 3px solid var(--cherry);
}

.board-hero__brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.wolf-mark {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, var(--metal), #2d3238);
  color: var(--white);
  font-family: "Anton", sans-serif;
  font-size: 1.1rem;
  letter-spacing: 0.04em;
  border: 2px solid var(--silver);
  flex-shrink: 0;
}

.board-hero__athletics {
  font-family: "Anton", sans-serif;
  font-size: clamp(0.95rem, 1.8vw, 1.35rem);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-style: italic;
  color: var(--ink);
}

.board-hero__university {
  font-size: clamp(0.58rem, 1vw, 0.72rem);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--metal);
}

.board-hero__stand {
  margin-top: 4px;
  font-size: clamp(0.62rem, 1.1vw, 0.78rem);
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--cherry);
}

.board-hero__favorites {
  text-align: center;
}

.value-banner {
  display: inline-block;
  background: var(--turquoise);
  color: var(--white);
  font-size: clamp(0.62rem, 1.1vw, 0.78rem);
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 4px 14px;
  transform: skewX(-10deg);
}

.favorites-title {
  margin: 6px 0 4px;
  font-family: "Anton", sans-serif;
  font-size: clamp(1.8rem, 4.2vw, 3.4rem);
  line-height: 0.92;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  font-style: italic;
  color: var(--ink);
  text-shadow: 2px 2px 0 rgba(186, 12, 47, 0.18);
}

.favorites-title::first-letter {
  color: var(--cherry);
}

.favorites-tagline {
  margin: 0;
  font-family: "Teko", sans-serif;
  font-size: clamp(0.95rem, 1.8vw, 1.35rem);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--cherry);
}

.board-hero__offer {
  display: flex;
  align-items: center;
  justify-content: end;
  gap: 12px;
}

.offer-badge {
  position: relative;
  display: grid;
  grid-template-columns: auto auto;
  grid-template-rows: auto auto;
  align-items: center;
  justify-items: start;
  gap: 0 6px;
  padding: 10px 16px 12px;
  background: var(--cherry);
  color: var(--white);
  clip-path: polygon(8% 0, 100% 0, 100% 78%, 92% 100%, 0 100%, 0 18%);
  min-width: 118px;
}

.offer-badge__four {
  grid-row: 1 / 3;
  font-family: "Anton", sans-serif;
  font-size: clamp(2.8rem, 5vw, 4.2rem);
  line-height: 0.85;
  font-style: italic;
}

.offer-badge__for {
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.14em;
}

.offer-badge__price {
  font-family: "Anton", sans-serif;
  font-size: clamp(1.6rem, 3vw, 2.2rem);
  line-height: 1;
  font-style: italic;
}

.offer-products {
  display: grid;
  grid-template-columns: repeat(4, minmax(52px, 1fr));
  gap: 8px;
}

.offer-product {
  display: grid;
  gap: 4px;
  justify-items: center;
  text-align: center;
}

.offer-product span {
  font-size: 0.58rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--metal);
}

.offer-product__shot {
  width: 54px;
  height: 54px;
  border-radius: 10px;
  background:
    linear-gradient(160deg, rgba(255, 255, 255, 0.35), transparent 50%),
    var(--metal);
  border: 2px solid var(--silver);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
}

.offer-product__shot[data-product="Pepsi"] {
  background: linear-gradient(160deg, #1c4f9c, #0b2148);
}
.offer-product__shot[data-product="Lobo Dog"] {
  background: linear-gradient(160deg, #d9a06a, #8a4b28);
}
.offer-product__shot[data-product="Popcorn"] {
  background: linear-gradient(160deg, #f2d56b, #ba0c2f 70%);
}
.offer-product__shot[data-product="Water"] {
  background: linear-gradient(160deg, #8fd0ef, #2a6f96);
}

/* —— 5-column menu tier —— */
.board-cols {
  display: grid;
  grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr));
  gap: 0;
  padding: 10px 12px 8px;
  min-height: 0;
  background: rgba(255, 255, 255, 0.72);
}

.menu-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 12px 10px;
  border-right: 1px solid rgba(186, 12, 47, 0.35);
  min-width: 0;
}

.menu-col:last-child {
  border-right: 0;
}

.menu-col__head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.menu-col__icon {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--cherry);
  color: var(--white);
  flex-shrink: 0;
}

.menu-col__icon svg {
  width: 16px;
  height: 16px;
}

.menu-col__title {
  margin: 0;
  font-family: "Anton", sans-serif;
  font-size: clamp(1rem, 1.8vw, 1.45rem);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-style: italic;
  color: var(--ink);
}

.item-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 7px;
}

.item__row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: end;
  gap: 6px;
}

.item__name {
  font-weight: 800;
  font-size: clamp(0.68rem, 1.15vw, 0.88rem);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  white-space: nowrap;
}

.item__leader {
  border-bottom: 1px dotted rgba(74, 79, 85, 0.45);
  margin-bottom: 4px;
  min-width: 8px;
}

.item__price {
  font-family: "Teko", sans-serif;
  font-size: clamp(1rem, 1.7vw, 1.35rem);
  color: var(--cherry);
  line-height: 1;
  font-weight: 600;
}

.item__price--empty {
  min-width: 0;
}

.item__note {
  margin-top: 1px;
  color: var(--muted);
  font-size: clamp(0.55rem, 0.95vw, 0.68rem);
  font-weight: 600;
}

.item__sizes {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  color: var(--metal);
  font-size: clamp(0.58rem, 1vw, 0.72rem);
  font-weight: 700;
}

.item.is-highlight .item__name::after {
  content: "VALUE";
  display: inline-block;
  margin-left: 6px;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--turquoise);
  color: var(--white);
  font-size: 0.55rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  vertical-align: middle;
}

.item.is-accent .item__name,
.item.is-accent .item__price {
  color: var(--turquoise);
}

.age-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.age-badge {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: var(--white);
  font-size: 0.55rem;
  font-weight: 800;
}

.brand-chip {
  padding: 3px 8px;
  background: var(--metal);
  color: var(--white);
  font-size: 0.58rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border-radius: 3px;
}

.logo-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: auto;
  padding-top: 6px;
}

.logo-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 38px;
  height: 22px;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--white);
  border: 1px solid #d0d3d8;
  color: var(--metal);
  font-size: 0.52rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

/* —— Footer tier —— */
.board-footer {
  display: grid;
  grid-template-columns: 1.1fr 1fr 1.3fr 1.3fr;
  gap: 0;
  min-height: 64px;
}

.board-footer > div {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  padding: 10px 14px;
  color: var(--white);
}

.board-footer strong {
  font-family: "Teko", sans-serif;
  font-size: clamp(0.95rem, 1.6vw, 1.25rem);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 700;
}

.board-footer__cashless {
  background: var(--cherry);
}

.board-footer__fuel {
  background: #12151a;
}

.board-footer__pay {
  background: var(--metal);
}

.board-footer__thanks {
  background: linear-gradient(120deg, #0e7f89, var(--turquoise));
}

.contactless {
  width: 22px;
  height: 14px;
  border: 2px solid rgba(255, 255, 255, 0.85);
  border-radius: 40%;
  position: relative;
}

.contactless::before,
.contactless::after {
  content: "";
  position: absolute;
  inset: 2px;
  border: 2px solid transparent;
  border-right-color: rgba(255, 255, 255, 0.85);
  border-radius: 40%;
}

.contactless::after {
  inset: 5px;
}

.pay-methods {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.pay-methods span {
  font-size: 0.55rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: rgba(255, 255, 255, 0.14);
  padding: 2px 6px;
  border-radius: 3px;
}

.board-tax {
  margin: 0;
  padding: 4px 14px 6px;
  font-size: 0.58rem;
  font-weight: 700;
  color: var(--muted);
  background: #eceef1;
}

/* —— Standalone promo poster (tab) —— */
.promo-board {
  max-width: 760px;
  margin: 0 auto;
  background: #0e1013;
  color: var(--white);
  box-shadow: var(--board-shadow);
  overflow: hidden;
  border: 1px solid #2a2e33;
}

.promo-board__hero {
  position: relative;
  padding: 36px 28px 28px;
  background:
    radial-gradient(ellipse at 70% 20%, rgba(255, 255, 255, 0.22), transparent 45%),
    radial-gradient(ellipse at 30% 0%, rgba(186, 12, 47, 0.55), transparent 50%),
    linear-gradient(160deg, #3a0a14 0%, #12080c 45%, #0e1013 100%);
  min-height: 260px;
}

.promo-board__hero::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 4px;
  background: var(--turquoise);
}

.promo-kicker {
  margin: 0 0 8px;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--silver);
}

.promo-headline {
  margin: 0;
  font-family: "Anton", sans-serif;
  font-size: clamp(3.4rem, 10vw, 6rem);
  line-height: 0.9;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  font-style: italic;
}

.promo-headline span {
  color: var(--cherry);
  -webkit-text-stroke: 2px var(--white);
  paint-order: stroke fill;
}

.promo-sub {
  margin: 12px 0 0;
  font-family: "Teko", sans-serif;
  font-size: 1.5rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--silver);
}

.promo-board__menu {
  padding: 22px 22px 28px;
  background: #14171c;
}

.promo-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--cherry);
  padding: 8px 14px;
  margin-bottom: 10px;
}

.promo-bar strong {
  font-family: "Anton", sans-serif;
  font-size: 1.35rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-style: italic;
}

.promo-bar em {
  font-style: normal;
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  background: #0e1013;
  padding: 4px 10px;
  border-radius: 999px;
}

.promo-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid rgba(186, 12, 47, 0.65);
}

.promo-cell {
  padding: 16px 10px;
  text-align: center;
  border-right: 1px solid rgba(186, 12, 47, 0.65);
}

.promo-cell:last-child {
  border-right: 0;
}

.promo-cell__name {
  display: block;
  color: var(--cherry);
  font-weight: 800;
  font-size: 0.82rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.promo-cell__price {
  display: inline-block;
  margin-top: 8px;
  font-family: "Anton", sans-serif;
  font-size: 2.4rem;
  line-height: 1;
}

/* Menu prices omit dollar signs per production convention.
   Keep the $ only on the large "4 FOR $4" headline brand lockup. */

.promo-cell__price::after {
  content: "";
  display: block;
  width: 42px;
  height: 4px;
  margin: 8px auto 0;
  background: var(--cherry);
  border-radius: 2px;
  transform: skewX(-18deg);
}

.promo-foot {
  margin: 18px 0 0;
  text-align: center;
}

.promo-foot p {
  margin: 0;
  font-family: "Anton", sans-serif;
  font-size: 1.15rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--cherry);
  font-style: italic;
}

.promo-foot .hash {
  margin-top: 6px;
  color: var(--white);
  font-weight: 800;
  letter-spacing: 0.12em;
}

.promo-foot .note {
  margin-top: 10px;
  color: var(--silver);
  font-size: 0.78rem;
  font-weight: 600;
}

/* —— Responsive —— */

        const sizes = item.sizes
          ? `<div class="item__sizes">${item.sizes.map((s) => `<span>${s}</span>`).join("")}</div>`
          : "";
        const price =
          item.price != null
            ? `<span class="item__price">${money(item.price)}</span>`
            : `<span class="item__price item__price--empty"></span>`;
        return `<li class="item ${mods}">

        </div>`
      : "";

    return `${meta}<article class="${boardClass}" data-location="${location.id}" data-print="${location.printKey || ""}">
      ${renderHero(location)}
      <div class="board-cols" style="--cols:${cols.length}">
        ${cols.map(renderColumn).join("")}
      </div>
      ${renderFooter()}
      <p class="board-tax">${data.taxNote}${print.label ? ` · Print: ${print.label}` : ""}</p>
    </article>`;
  }

  function renderPromoPoster() {
    const p = data.promo;
    return `<article class="promo-board" data-promo="${p.id}">
      <div class="promo-board__hero">
        <p class="promo-kicker">All Season Long</p>
        <h1 class="promo-headline">4 FOR <span>$4</span></h1>
        <p class="promo-sub">${p.headline} · ${p.valueLabel}</p>
      </div>
      <div class="promo-board__menu">
        <div class="promo-bar">
          <strong>${p.headline}</strong>
          <em>${p.valueLabel}</em>
        </div>
        <div class="promo-grid">
          ${p.products
            .map(
              (item) => `<div class="promo-cell">
                <span class="promo-cell__name">${item.label}</span>
                <span class="promo-cell__price">4</span>
              </div>`
            )
            .join("")}
        </div>
        <div class="promo-foot">
          <p>${p.tagline}</p>
          <div class="hash">${p.hashtag}</div>
          <div class="note">${p.note}</div>
        </div>
      </div>
    </article>`;
  }

  function fillDeck() {
    els.deck.innerHTML = data.locations
      .map(
        (loc) => `<div class="deck-card">
          <div class="deck-card__label">
            <span>#${String(loc.page).padStart(2, "0")} · ${loc.placement || ""}</span>
            <span>${loc.name} · ${loc.stand} · ${loc.print?.label || ""}</span>
          </div>
          ${renderBoard(loc, { showMeta: false })}
        </div>`
      )
      .join("");
  }

  function fillSelect() {
    els.select.innerHTML = data.locations
      .map((loc) => {
        const size = loc.print?.label || "";
        return `<option value="${loc.id}">#${loc.page} — ${loc.name} — ${loc.stand} — ${size}</option>`;
      })
      .join("");
  }

  function showBoard(id) {
    const loc = data.locations.find((l) => l.id === id) || data.locations[0];
    els.board.innerHTML = renderBoard(loc, { solo: true, showMeta: true });
    els.select.value = loc.id;
  }

  function setView(view) {
    els.tabs.forEach((tab) => tab.classList.toggle("is-active", tab.dataset.view === view));
    els.deck.hidden = view !== "deck";
    els.board.hidden = view !== "board";
    els.promo.hidden = view !== "promo";
    els.toolbar.hidden = view !== "board";
  }

  function ensurePrintStyleEl() {
    let el = document.getElementById("printPageStyle");
    if (!el) {
      el = document.createElement("style");
      el.id = "printPageStyle";
      document.head.appendChild(el);
    }
    return el;
  }

  /** Set @page to Fireup inches for the active board (or letter for deck/promo). */
  function applyPrintPageSize(location) {
    const el = ensurePrintStyleEl();
    if (!location?.print) {
      el.textContent = `@media print { @page { size: letter landscape; margin: 0.25in; } }`;
      document.documentElement.dataset.printSize = "letter-landscape";
      return;
    }
    const { widthIn, heightIn, orientation, label } = location.print;
    const sizeValue =
      orientation === "portrait" ? `${widthIn}in ${heightIn}in` : `${widthIn}in ${heightIn}in`;
    el.textContent = `
@media print {
  @page {
    size: ${sizeValue};
    margin: 0;
  }
}
`.trim();
    document.documentElement.dataset.printSize = label || `${widthIn}x${heightIn}`;
  }

  function printCurrentView() {
    const activeTab = els.tabs.find((t) => t.classList.contains("is-active"));
    const view = activeTab?.dataset.view || "board";

    if (view === "board") {
      const loc =
        data.locations.find((l) => l.id === els.select.value) || data.locations[0];
      applyPrintPageSize(loc);
      // Brief beat so the style tag is in the DOM before the print dialog
      requestAnimationFrame(() => window.print());
      return;
    }

    if (view === "deck") {
      // Deck uses one shared page size (largest common landscape proof).
      // For final production, print Single Board one location at a time.
      applyPrintPageSize({
        print: {
          widthIn: 96,
          heightIn: 36,
          orientation: "landscape",
          label: "96 in × 36 in Landscape (deck proof)",
        },
      });
      requestAnimationFrame(() => window.print());
      return;
    }

    // Promo poster — tabloid-friendly proof
    ensurePrintStyleEl().textContent = `
@media print {
  @page { size: tabloid portrait; margin: 0.4in; }
}
`.trim();
    document.documentElement.dataset.printSize = "tabloid-portrait";
    requestAnimationFrame(() => window.print());
  }

  fillDeck();
  fillSelect();
  showBoard(data.locations[0].id);
  applyPrintPageSize(data.locations[0]);
  els.promo.innerHTML = renderPromoPoster();
  setView("board");

  els.tabs.forEach((tab) => {
    tab.addEventListener("click", () => setView(tab.dataset.view));
  });
  els.select.addEventListener("change", () => {
    showBoard(els.select.value);
    const loc = data.locations.find((l) => l.id === els.select.value);
    applyPrintPageSize(loc);
  });
  els.printBtn.addEventListener("click", printCurrentView);
})();

    </script>
  </body>
</html>
